<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Parking IoT 3D - Gemelo Digital</title>
  
  <!-- Librerías -->
  <script src="./js/three.min.js"></script>
  <script src="./js/OrbitControls.js"></script>
  <script src="./js/sweetalert2.all.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #0b0e14; color: #fff; overflow: hidden; height: 100vh; }
    #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top:0; left:0; z-index: 1; }

    /* Overlay HUD Glassmorphism para Celulares */
    .hud-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 16px;
    }

    .glass-card {
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px; padding: 16px;
      pointer-events: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }

    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-paid { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
    .badge-unpaid { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }

    .counter-box {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000; padding: 8px 16px; border-radius: 14px; text-align: center;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }

    .guidance-banner {
      background: rgba(0, 242, 254, 0.12); border: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 12px; padding: 10px 14px; text-align: center;
      color: #00f2fe; font-weight: 600; font-size: 0.85rem; margin-top: 12px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    /* Botones Interactivos Custom */
    .btn-action {
      background: linear-gradient(135deg, #1f293d 0%, #111827 100%);
      border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;
      padding: 12px; border-radius: 14px; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%;
    }
    .btn-action:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #00f2fe 0%, #0072ff 100%);
      color: #fff; border: none; font-weight: 700;
      box-shadow: 0 4px 20px rgba(0, 114, 255, 0.4);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Estilo del Popup SweetAlert2 */
    .swal2-popup {
      background: #171d2a !important; color: #fff !important;
      border-radius: 20px !important; border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }
    .swal2-title { color: #00f2fe !important; }
    .swal2-input { background: #0f141e !important; color: #fff !important; border-color: #374151 !important; border-radius: 10px !important; }
  </style>
</head>
<body>

  <!-- Contenedor Renderizador 3D -->
  <div id="canvas-container"></div>

  <!-- HUD Frontal (Interfaz de Usuario) -->
  <div class="hud-container">
    
    <!-- Header Superior -->
    <div class="glass-card">
      <div class="header-bar">
        <div>
          <h1 style="font-size: 1rem; font-weight: 700; color: #00f2fe; text-transform: uppercase; letter-spacing: 0.5px;">
            Parking 3D IoT
          </h1>
          <p style="font-size: 0.75rem; color: #9ca3af;">Gemelo Digital en Tiempo Real</p>
        </div>

        <div class="counter-box">
          <span style="font-size: 1.25rem; font-weight: 900; display: block; line-height: 1;" id="lbl-disponibles">6</span>
          <span style="font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Libres</span>
        </div>
      </div>

      <!-- Banner Asistente Guía -->
      <div class="guidance-banner" id="banner-guia">
        <span id="txt-guia">Buscando plaza disponible...</span>
      </div>
    </div>

    <!-- Panel Inferior de Controles -->
    <div class="glass-card">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
        <span style="font-size: 0.75rem; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px;">Acceso & Validación</span>
        <div id="status-pay-badge" class="status-badge badge-unpaid">
          Sin Validar
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">
        <button class="btn-action btn-secondary" onclick="pedirCodigoPago()">
          Validar Ticket
        </button>
        <button class="btn-action btn-primary" onclick="intentarAbrirBarrera()">
          Abrir Barrera
        </button>
      </div>

      <span style="font-size: 0.75rem; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 8px;">Control de Elevador</span>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
        <button class="btn-action" onclick="moverElevador(1)">P1 (PB)</button>
        <button class="btn-action" onclick="moverElevador(2)">P2 (1º)</button>
        <button class="btn-action" onclick="moverElevador(3)">P3 (2º)</button>
      </div>
    </div>

  </div>

  <script>
    // --- ESTADO GENERAL Y CONFIGURACIÓN ---
    const ESTADO = {
      autenticado: false,
      codigoCorrecto: "1234", // Código de prueba por defecto
      disponibles: 6,
      elevadorPiso: 1,
      plazasP3: [true, true, true], // Piso 3 (LDRs)
      plazasP2: [true, true, true]  // Piso 2 (Switches)
    };

    // --- CONFIGURACIÓN DE ESCENA THREE.JS ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0e14);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(14, 14, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Impedir traspasar el suelo
    controls.minDistance = 8;
    controls.maxDistance = 35;

    // --- ILUMINACIÓN AMBIENTAL Y DIRECCIONAL ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x00f2fe, 1.0);
    dirLight.position.set(12, 25, 15);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    const fillLight = new THREE.PointLight(0xffb86c, 0.4, 40);
    fillLight.position.set(-10, 10, -10);
    scene.add(fillLight);

    // --- MATERIALES BASADOS EN LA FOTO DE LA MAQUETA 3D REAL ---
    const matPlasticoOscuro = new THREE.MeshStandardMaterial({ color: 0x1f242d, roughness: 0.5 }); // Plástico Negro/Gris de la maqueta
    const matPlasticoCrema = new THREE.MeshStandardMaterial({ color: 0xe8d5c4, roughness: 0.3 });  // Parantes y bordes crema
    const matLineaBlanca = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const matPlazaLibre = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.2, emissive: 0x10b981, emissiveIntensity: 0.3 });
    const matPlazaOcupada = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2, emissive: 0xef4444, emissiveIntensity: 0.3 });

    // --- CONSTRUCCIÓN ESTRUCTURAL DE LA MAQUETA DE 3 PISOS ---
    const torreGroup = new THREE.Group();
    scene.add(torreGroup);

    // Malla Suelo Base e Pisos (3 Pisos)
    const floorShape = new THREE.BoxGeometry(7, 0.3, 9);
    for (let i = 0; i < 3; i++) {
      const floor = new THREE.Mesh(floorShape, matPlasticoOscuro);
      floor.position.set(0, i * 3.6, 0);
      floor.receiveShadow = true;
      torreGroup.add(floor);

      // Bordes Crema Laterales (Como en la foto real)
      const borderSide1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 9), matPlasticoCrema);
      borderSide1.position.set(3.5, i * 3.6 + 0.3, 0);
      torreGroup.add(borderSide1);

      const borderSide2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 9), matPlasticoCrema);
      borderSide2.position.set(-3.5, i * 3.6 + 0.3, 0);
      torreGroup.add(borderSide2);

      // Parantes Frontales Crema
      const pillar1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), matPlasticoCrema);
      pillar1.position.set(3.3, i * 3.6 + 0.6, 4.3);
      torreGroup.add(pillar1);

      const pillar2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), matPlasticoCrema);
      pillar2.position.set(-3.3, i * 3.6 + 0.6, 4.3);
      torreGroup.add(pillar2);

      // Demarcación de Líneas Blancas de Estacionamiento
      for (let lineIdx = 0; lineIdx < 4; lineIdx++) {
        const line = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.02, 3.2), matLineaBlanca);
        line.position.set(-2.7 + lineIdx * 1.8, i * 3.6 + 0.16, 1.8);
        torreGroup.add(line);
      }
    }

// --- TORRE DEL ELEVADOR (ESTRUCTURA ABIERTA COMO LA MAQUETA REAL) ---
    const elevGroup = new THREE.Group();
    torreGroup.add(elevGroup);

    // 4 Columnas esquineras para que el ascensor sea 100% visible por dentro
    const pillarShaftGeom = new THREE.BoxGeometry(0.3, 11.5, 0.3);
    const pillarPositions = [
      [-1.5, -1.5], [1.5, -1.5], [-1.5, 1.5], [1.5, 1.5]
    ];
    pillarPositions.forEach(([px, pz]) => {
      const pMesh = new THREE.Mesh(pillarShaftGeom, matPlasticoOscuro);
      pMesh.position.set(px, 5.5, -3.2 + pz);
      elevGroup.add(pMesh);
    });

    // Techo de la torre
    const shaftRoof = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.4, 3.5), matPlasticoOscuro);
    shaftRoof.position.set(0, 11.3, -3.2);
    elevGroup.add(shaftRoof);

    // Motor Nema 17 en la cima
    const nemaBody = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), matPlasticoOscuro);
    nemaBody.position.set(0, 12.3, -3.2);
    elevGroup.add(nemaBody);

    const nemaCap = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1, 16), matPlasticoCrema);
    nemaCap.position.set(0, 13.4, -3.2);
    elevGroup.add(nemaCap);

    // Plataforma Móvil con Neón Cian (Para destacar en 3D)
    const elevPlatformGeom = new THREE.BoxGeometry(2.8, 0.3, 2.8);
    const matElevPlatform = new THREE.MeshStandardMaterial({ 
      color: 0x00f2fe, 
      metalness: 0.8, 
      roughness: 0.2,
      emissive: 0x00a8ff,
      emissiveIntensity: 0.6 
    });
    const elevPlatform = new THREE.Mesh(elevPlatformGeom, matElevPlatform);
    elevPlatform.position.set(0, 0.2, -3.2);
    scene.add(elevPlatform);

    // Auto Rojo de prueba sobre la plataforma para ver el movimiento claramente
    const carMock = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 0.7, 2.2),
      new THREE.MeshStandardMaterial({ color: 0xff4757, roughness: 0.3 })
    );
    carMock.position.set(0, 0.5, 0);
    elevPlatform.add(carMock); // Queda fijo al elevador y sube/baja con él

    // --- GENERADOR DE TEXTURAS DE ETIQUETAS EN 3D ---
    function crearEtiquetaCanvas(texto) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      
      ctx.fillStyle = "rgba(17, 24, 39, 0.9)";
      ctx.beginPath(); ctx.roundRect(10, 10, 236, 108, 16); ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = "#00f2fe"; ctx.stroke();
      
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 32px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(texto, 128, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(1.6, 0.8, 1);
      return sprite;
    }

    // --- PLAZAS DE ESTACIONAMIENTO INTERACTIVAS ---
    const plazas3D = { P2: [], P3: [] };
    const spotGeom = new THREE.BoxGeometry(1.5, 0.04, 3.0);

    function crearPlazasPiso(pisoIndex, nombrePiso, arrayTarget) {
      for (let j = 0; j < 3; j++) {
        const meshPlaza = new THREE.Mesh(spotGeom, matPlazaLibre.clone());
        meshPlaza.position.set(-1.8 + j * 1.8, pisoIndex * 3.6 + 0.17, 1.8);
        scene.add(meshPlaza);

        // Etiqueta Nombre 3D (Sprite)
        const etiqueta3D = crearEtiquetaCanvas(`${nombrePiso}-P${j+1}`);
        etiqueta3D.position.set(-1.8 + j * 1.8, pisoIndex * 3.6 + 1.2, 1.8);
        scene.add(etiqueta3D);

        arrayTarget.push(meshPlaza);
      }
    }

    crearPlazasPiso(1, "P2", plazas3D.P2); // Piso 2
    crearPlazasPiso(2, "P3", plazas3D.P3); // Piso 3

    // --- LÓGICA DE ACTUALIZACIÓN DEL MODELO 3D ---
    function actualizarModelo3D() {
      document.getElementById('lbl-disponibles').innerText = ESTADO.disponibles;

      // Actualizar Color de Plazas P3
      ESTADO.plazasP3.forEach((libre, idx) => {
        plazas3D.P3[idx].material.color.setHex(libre ? 0x10b981 : 0xef4444);
        plazas3D.P3[idx].material.emissive.setHex(libre ? 0x10b981 : 0xef4444);
      });

      // Actualizar Color de Plazas P2
      ESTADO.plazasP2.forEach((libre, idx) => {
        plazas3D.P2[idx].material.color.setHex(libre ? 0x10b981 : 0xef4444);
        plazas3D.P2[idx].material.emissive.setHex(libre ? 0x10b981 : 0xef4444);
      });

      // Actualizar Asistente Guía de Plaza
      let mensajeGuia = "Parking Completo";
      let plazaEncontrada = false;

      for (let i = 0; i < 3; i++) {
        if (ESTADO.plazasP2[i]) {
          mensajeGuia = `Diríjase a Piso 2 - Plaza ${i+1}`;
          plazaEncontrada = true;
          break;
        }
      }
      if (!plazaEncontrada) {
        for (let i = 0; i < 3; i++) {
          if (ESTADO.plazasP3[i]) {
            mensajeGuia = `Diríjase a Piso 3 - Plaza ${i+1}`;
            plazaEncontrada = true;
            break;
          }
        }
      }
      document.getElementById('txt-guia').innerText = mensajeGuia;
    }

    // --- POLLING CON ESP32 O MODO FALLBACK SIMULADO ---
    async function pollingEstadoESP32() {
      try {
        const res = await fetch('/api/estado');
        const data = await res.json();
        ESTADO.disponibles = data.disponibles;
        ESTADO.elevadorPiso = data.elevadorPiso;
        ESTADO.plazasP3 = data.plazasP3;
        ESTADO.plazasP2 = data.plazasP2;
      } catch (e) {
        // Modo simulación sin servidor
      }
      actualizarModelo3D();
    }

    // --- INTERACCIONES Y MODALES (SWEETALERT2) ---

    // 1. Pedir Código de Pago Simulado
    function pedirCodigoPago() {
      Swal.fire({
        title: 'Validación de Ticket',
        text: 'Ingrese su código de habilitación de pago (Código de prueba: 1234):',
        input: 'text',
        inputPlaceholder: 'Ej: 1234',
        showCancelButton: true,
        confirmButtonText: 'Validar',
        cancelButtonText: 'Cancelar',
        confirmButtonColor: '#00f2fe',
      }).then((result) => {
        if (result.isConfirmed) {
          if (result.value === ESTADO.codigoCorrecto) {
            ESTADO.autenticado = true;
            const badge = document.getElementById('status-pay-badge');
            badge.className = "status-badge badge-paid";
            badge.innerHTML = `Pago Validado`;

            Swal.fire({
              icon: 'success',
              title: '¡Pago Confirmado!',
              text: 'Se ha habilitado el acceso para abrir la barrera remota.',
              timer: 2000,
              showConfirmButton: false
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: 'Código Inválido',
              text: 'El código ingresado no es válido. Intente con 1234.'
            });
          }
        }
      });
    }

    // 2. Intentar Abrir Barrera con Conteo de 15 Segundos
    function intentarAbrirBarrera() {
      if (!ESTADO.autenticado) {
        Swal.fire({
          icon: 'warning',
          title: 'Acceso Denegado',
          text: 'Debe validar el ticket de pago antes de abrir la barrera.',
          confirmButtonText: 'Ingresar Código',
          confirmButtonColor: '#00f2fe'
        }).then(() => {
          pedirCodigoPago();
        });
        return;
      }

      // Enviar comando al ESP32
      fetch('/abrirBarrera').catch(() => {});

      // Mostrar SweetAlert2 con Temporizador de 15 Segundos
      let timerInterval;
      Swal.fire({
        title: '🚗 Barrera Abriéndose...',
        html: 'Acceso concedido. Dispone de <b>15</b> segundos para ingresar con el vehículo.<br><br><div style="width: 100%; background: #374151; height: 8px; border-radius: 4px; overflow: hidden;"><div id="swal-progress" style="background: #00f2fe; height: 100%; width: 100%; transition: all 1s linear;"></div></div>',
        timer: 15000,
        timerProgressBar: false,
        showConfirmButton: false,
        allowOutsideClick: false,
        didOpen: () => {
          const b = Swal.getHtmlContainer().querySelector('b');
          const progress = document.getElementById('swal-progress');
          let tiempoRestante = 15;

          timerInterval = setInterval(() => {
            tiempoRestante--;
            if (b) b.textContent = tiempoRestante;
            if (progress) progress.style.width = `${(tiempoRestante / 15) * 100}%`;
          }, 1000);
        },
        willClose: () => {
          clearInterval(timerInterval);
        }
      }).then((result) => {
        if (result.dismiss === Swal.DismissReason.timer) {
          Swal.fire({
            icon: 'info',
            title: '🔒 Barrera Cerrándose',
            text: 'La barrera ha regresado a su posición de seguridad.',
            timer: 2500,
            showConfirmButton: false
          });
        }
      });
    }

    // 3. Mover Elevador
    function moverElevador(piso) {
      if (ESTADO.elevadorPiso === piso) {
        Swal.fire({
          icon: 'info',
          title: 'Elevador posicionado',
          text: `La plataforma ya se encuentra en el Piso ${piso}`,
          timer: 1500,
          showConfirmButton: false,
          background: '#161b26',
          color: '#fff'
        });
        return;
      }

      const accion = piso > ESTADO.elevadorPiso ? "Subiendo" : "Bajando";

      Swal.fire({
        title: `🛗 ${accion} Elevador...`,
        html: `Trasladando plataforma hacia el <b>Piso ${piso}</b>`,
        timer: 2000,
        timerProgressBar: true,
        showConfirmButton: false,
        background: '#161b26',
        color: '#fff',
        didOpen: () => {
          Swal.showLoading();
        }
      });

      ESTADO.elevadorPiso = piso;
      fetch(`/moverElevador?piso=${piso}`).catch(() => {});
    }

    // --- BUCLE DE ANIMACIÓN Y RENDERIZADO 3D ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      // Animación suave (Interpolación) de movimiento del elevador
      const targetY = (ESTADO.elevadorPiso - 1) * 3.6 + 0.2;
      elevPlatform.position.y += (targetY - elevPlatform.position.y) * 0.05;

      renderer.render(scene, camera);
    }

    // Iniciar bucle
    animate();
    setInterval(pollingEstadoESP32, 2000);

    // Ajuste Responsivo ante cambio de tamaño de ventana
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
